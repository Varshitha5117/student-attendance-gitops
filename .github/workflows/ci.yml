name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies and Lint
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        # Stop the build if there are Python syntax errors or undefined names
        flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 app/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Log in to the Container registry
      uses: docker/login-action@v2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set lowercase image name
      run: echo "IMAGE_LOWER=$(echo '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

    - name: Build Docker Image
      run: |
        docker build -t ${{ env.IMAGE_LOWER }}:${{ github.sha }} .
        docker tag ${{ env.IMAGE_LOWER }}:${{ github.sha }} ${{ env.IMAGE_LOWER }}:latest

    - name: Run Trivy Vulnerability Scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: '${{ env.IMAGE_LOWER }}:${{ github.sha }}'
        format: 'table'
        exit-code: '0' # Set to 1 to fail the build on critical vulnerabilities
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'

    - name: Push Docker Image to GHCR
      run: |
        docker push ${{ env.IMAGE_LOWER }}:${{ github.sha }}
        docker push ${{ env.IMAGE_LOWER }}:latest

    - name: Update Kubernetes deployment.yaml with new Image Tag
      run: |
        # Update the image tag using sed to reflect the newly built SHA tag
        sed -i "s|image: .*|image: ${{ env.IMAGE_LOWER }}:${{ github.sha }}|" k8s/deployment.yaml

    - name: Commit and Push changes to trigger ArgoCD
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add k8s/deployment.yaml
        git commit -m "Update image tag to ${{ github.sha }}"
        git push
